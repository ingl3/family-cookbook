<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family cookbook moderation</title><style>body{max-width:800px;margin:30px auto;padding:20px;background:#f7f4ed;color:#345441;font:18px Georgia}button,input{font:inherit;padding:10px;margin:5px}article{border-top:1px solid #cbbba4;padding:20px 0}pre{white-space:pre-wrap;font:inherit}</style><h1>Family recipe moderation</h1><p>Administrator access required.</p><input id="secret" type="password" placeholder="Administrator access key"><button id="load">Load submissions</button><p id="status"></p><main id="queue"></main><script>async function call(action,data){let r=await fetch('/api/family?action='+action,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.querySelector('#secret').value},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){try{let rows=await call('queue',{});let q=document.querySelector('#queue');q.replaceChildren();for(let x of rows){let a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=x.original.title+' — '+x.status;p.textContent=Object.entries(x.original).filter(([k])=>k!=='photo').map(([k,v])=>k+': '+v).join('\n');a.append(h,p);if(x.original.photo){let im=document.createElement('img');im.src=x.original.photo;im.style.maxWidth='100%';a.append(im)}for(let s of ['approved','archived']){let b=document.createElement('button');b.textContent=s==='approved'?'Approve and publish':'Archive';b.onclick=async()=>{try{await call('moderate',{id:x.id,status:s});load()}catch(e){document.querySelector('#status').textContent=e.message}};a.append(b)}q.append(a)}document.querySelector('#status').textContent=rows.length+' submissions'}catch(e){document.querySelector('#status').textContent=e.message}}document.querySelector('#load').onclick=load;</script></html>
